<!--
  Doodle "sprite": each <symbol> is a hand-drawn-style icon defined once,
  then placed anywhere with  <svg class="doodle"><use href="#d-star"/></svg>.
  The sprite itself is invisible (width/height 0). All stroke-based, so the
  ink colour comes from CSS `color` via stroke="currentColor".
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Five-point star, slightly wobbly path so it feels hand-drawn -->
  <symbol id="d-star" viewBox="0 0 40 40">
    <path d="M20 3 L24.6 15.2 L37.5 15.6 L27.2 23.6 L31 36.2 L20 28.8 L9.2 36.6 L12.9 23.8 L2.6 15.9 L15.6 15 Z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <!-- Filled star (the dark ones in the original) -->
  <symbol id="d-star-fill" viewBox="0 0 40 40">
    <path d="M20 3 L24.6 15.2 L37.5 15.6 L27.2 23.6 L31 36.2 L20 28.8 L9.2 36.6 L12.9 23.8 L2.6 15.9 L15.6 15 Z"
          fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>
  <!-- Tiny asterisk sparkle -->
  <symbol id="d-sparkle" viewBox="0 0 20 20">
    <path d="M10 1v18M1 10h18M3.5 3.5l13 13M16.5 3.5l-13 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
  <!-- Outline heart drawn as one loop -->
  <symbol id="d-heart" viewBox="0 0 40 36">
    <path d="M20 33 C6 23 2 16 3.5 10 C5 4 12 2 16 6 C18 8 19.5 10 20 12 C20.5 10 22 8 24 6 C28 2 35 4 36.5 10 C38 16 34 23 20 33 Z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <!-- Pixel heart: a 9×8 grid of squares; each <rect> is one "pixel" -->
  <symbol id="d-pixel-heart" viewBox="0 0 9 8">
    <path fill="currentColor"
      d="M1 0h2v1H1zM6 0h2v1H6zM0 1h1v3H0zM3 1h1v1H3zM5 1h1v1H5zM8 1h1v3H8zM4 2h1v1H4zM1 4h1v1H1zM7 4h1v1H7zM2 5h1v1H2zM6 5h1v1H6zM3 6h1v1H3zM5 6h1v1H5zM4 7h1v1H4z"/>
  </symbol>
  <!-- Butterfly: two wing loops on each side + body + antennae -->
  <symbol id="d-butterfly" viewBox="0 0 40 36">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M20 12 C14 2 3 3 4 11 C5 17 13 18 20 16"/>
      <path d="M20 12 C26 2 37 3 36 11 C35 17 27 18 20 16"/>
      <path d="M20 16 C13 18 8 26 12 30 C16 33 19 26 20 20"/>
      <path d="M20 16 C27 18 32 26 28 30 C24 33 21 26 20 20"/>
      <path d="M20 10 V28"/>
      <path d="M20 10 C18 6 16 5 15 4 M20 10 C22 6 24 5 25 4"/>
    </g>
  </symbol>
  <!-- Paperclip: one continuous rounded wire -->
  <symbol id="d-clip" viewBox="0 0 20 52">
    <path d="M14 14 V40 a5 5 0 0 1 -10 0 V9 a7 7 0 0 1 14 0 V38 a3 3 0 0 1 -6 0 V14"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</svg>
