    &copy; {{ site.time | date: "%Y" }} {{ site.author }} ·
    <a href="{{ '/' | relative_url }}">home</a> ·
    <a href="{{ '/feed.xml' | relative_url }}">follow via RSS</a>
  </p>
</footer>
