# =====================================================================
#  Site settings — GitHub Pages reads this file to build your blog.
#  After editing it, commit; GitHub rebuilds the site in ~1 minute.
# =====================================================================

# Shown in the header, browser tab, search results and the RSS feed.
title: "The Girl Next Door's cozy chaos"
tagline: "leave your shoes at the door, catch your breath & stay for the chaos."
subtitle: "(welcome to my tiny digital corner)"
description: "A cozy diary about moving to a big city, job hunting, and figuring things out one day at a time."
author: "The Girl Next Door"   # change to your name or keep the pen name
# --- HOME PAGE (Blogspot-style) ---------------------------------------
# "About me" box on the home page. Edit freely.
about: "new girl in a huge city. hunting for a job, collecting quiet moments by the river, and writing it all down one chapter at a time."
# Small round picture in the "About me" box. Any image in assets/img/ works.
avatar: /assets/img/2026-10-28-river.jpg
# Home-page pictures. By default the site uses its own painted artwork:
#   background → /assets/img/bg-swirl.jpg       (pink & olive swirls with sparkles)
#   header     → /assets/img/header-garden.jpg  (misty painted rose garden)
# To use your own photo instead: upload it to assets/img/, then remove the #
# in front of the line and put your file name in.
# background_image: /assets/img/my-background.jpg
# header_image: /assets/img/my-header.jpg

# "Currently reading" journal in the home-page sidebar.
# Change the title and author whenever you start a new book.
# cover is optional: upload a picture of the book cover to assets/img/ and
# remove the # to show it on the journal. Delete the whole block to hide the widget.
reading:
  title: "add your book here"
  author: "in _config.yml"
  # cover: /assets/img/book-cover.jpg

# --- HEADER MENU BUTTONS -----------------------------------------------
# Shown in the header of every page, left to right in this order.
# To add a button, copy a block of 3 lines and change it:
#   title → the text on the button
#   url   → a page of this site ("/my-page/") or a full link ("https://…")
#   icon  → seal (wax seal), bow (lace bow), or the simple line icons:
#           home, heart, book, star, camera, mail — or leave the line out
nav:
  - title: Home
    url: /
    icon: seal
  - title: About me
    url: /about/
    icon: bow
  - title: Childhood Favorites
    url: /childhood-favorites/
    icon: stickers/childhood_favorites.png

# --- THE TWO LINES YOU MUST CHECK -----------------------------------
# url:     https://YOUR-GITHUB-USERNAME.github.io   (no trailing slash)
# baseurl: ""            if your repo is named  YOUR-USERNAME.github.io
#          "/REPO-NAME"  if your repo has any other name, e.g. "/cozy-chaos"
url: "https://cozychaos-diary.github.io"
baseurl: ""
# ---------------------------------------------------------------------

# Post dates are interpreted in this time zone (matters near midnight).
timezone: Europe/Budapest

# Pretty links: /2026/10/28/first-step-into-cozy-chaos/
permalink: /:year/:month/:day/:title/

# Markdown engine GitHub Pages uses.
markdown: kramdown

# The home-page preview of each post is its first paragraph
# (Jekyll's default), cut to ~40 words in index.html.

# Plugins. Only these (and a few others) are allowed by GitHub Pages
# without extra setup — don't add random ones.
plugins:
  - jekyll-feed      # makes /feed.xml so people can follow you in RSS readers
  - jekyll-seo-tag   # adds proper page titles / share-preview tags
  - jekyll-sitemap   # makes /sitemap.xml for search engines

# Every file in _posts gets layout: post unless the post says otherwise.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Files that live in the repo but should NOT become pages on the site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
